events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    upstream api_servers {
        server api-gateway:4000;
    }

    upstream admin_dashboard {
        server admin-dashboard:80;
    }

    upstream ecommerce_frontend {
        server ecommerce-frontend:80;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 1m;

        # The storefront, the admin dashboard and the API share this origin,
        # so no CORS headers are needed.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # Ecommerce frontend
        location / {
            proxy_pass http://ecommerce_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin dashboard
        location /admin {
            rewrite ^/admin/?(.*)$ /$1 break;
            proxy_pass http://admin_dashboard;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Handle static files for admin dashboard
        location ~ ^/admin/(static/|favicon.ico|manifest.json) {
            rewrite ^/admin/(.*) /$1 break;
            proxy_pass http://admin_dashboard;
        }

        # API gateway. Stripe's webhook also arrives here (/api/payments/webhook);
        # the body is passed through unchanged so its signature still matches.
        location /api/ {
            proxy_pass http://api_servers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Overwrite, so a client cannot add its own X-Forwarded-For entries.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
