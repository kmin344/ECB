name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [cart-service]
    defaults:
      run:
        working-directory: ecommerce-boilerplate/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ecommerce-boilerplate/services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npx jest --ci
