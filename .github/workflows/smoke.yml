name: Smoke test (full stack)

# Builds every service with docker compose and runs the end-to-end
# smoke scripts through the API gateway. Run it manually from the
# Actions tab.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-boilerplate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the API gateway
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:4000/ >/dev/null && exit 0
            sleep 5
          done
          echo "API gateway did not become ready" && exit 1
      - run: npm ci
      - run: npm run test:smoke
      - name: Service logs
        if: always()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
